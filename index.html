<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32 Light Switch</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080d18;color:#eef3ff;font-family:Arial,sans-serif}
main{width:min(92vw,420px);padding:34px 26px;text-align:center;background:#111a2b;border:1px solid #263550;border-radius:24px;box-shadow:0 20px 70px #0008}
h1{font-size:25px;margin:0 0 8px}p{color:#9eacc5;margin:0 0 28px}
.lamp{width:90px;height:90px;margin:0 auto 24px;border-radius:50%;background:#27344a;box-shadow:inset 0 0 18px #0008;transition:.25s}
body.on .lamp{background:#ffe58a;box-shadow:0 0 18px #ffe58a,0 0 55px #ffcf55,0 0 100px #ffb52c}
.switch{position:relative;width:112px;height:58px;border:0;border-radius:40px;background:#34445e;padding:5px;cursor:pointer;transition:.2s}
.switch span{display:block;width:48px;height:48px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 8px #0005}
body.on .switch{background:#16a36a}body.on .switch span{transform:translateX(54px)}
.switch:focus-visible,input:focus-visible{outline:3px solid #75b7ff;outline-offset:3px}
.status{margin:20px 0 26px;font-weight:700;color:#aab8cf}.status.on{color:#67e6a8}
label{display:block;text-align:left;font-size:12px;color:#9eacc5;margin:0 0 8px}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #34445e;background:#0a1220;color:#fff;font-size:14px}
.note{font-size:12px;line-height:1.5;margin:14px 0 0;color:#8291aa}
</style>
</head>
<body>
<main>
  <h1>LIGHT CONTROL</h1>
  <p>ESP32 wireless light switch</p>
  <div class="lamp" aria-hidden="true"></div>
  <button class="switch" id="switch" type="button" role="switch" aria-checked="false" aria-label="Turn light on or off"><span></span></button>
  <div class="status" id="status">LIGHT OFF</div>
  <label for="esp">ESP32 address</label>
  <input id="esp" value="http://192.168.4.1" spellcheck="false">
  <div class="note">Connect your device to the ESP32 Wi-Fi, then use the switch. The ESP32 must have a matching /api/light endpoint.</div>
</main>
<script>
const toggle=document.getElementById('switch');
const statusText=document.getElementById('status');
const address=document.getElementById('esp');
let isOn=false;
function showState(on){isOn=on;document.body.classList.toggle('on',on);toggle.setAttribute('aria-checked',String(on));statusText.textContent=on?'LIGHT ON':'LIGHT OFF';statusText.classList.toggle('on',on)}
toggle.addEventListener('click',async()=>{
  const next=!isOn;
  statusText.textContent='SENDING...';
  toggle.disabled=true;
  try{
    const base=address.value.trim().replace(/\/$/,'');
    if(!/^https?:\/\//i.test(base)) throw new Error('Enter a valid ESP32 address');
    const response=await fetch(base+'/api/light',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({on:next})});
    if(!response.ok) throw new Error('ESP32 returned HTTP '+response.status);
    showState(next);
  }catch(error){
    statusText.textContent='CONNECTION FAILED';
    statusText.classList.remove('on');
    console.error(error);
    alert('Could not reach the ESP32. Check its Wi-Fi, address, and /api/light firmware endpoint. '+error.message);
  }finally{toggle.disabled=false}
});
</script>
</body>
</html>
